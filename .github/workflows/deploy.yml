name: Deploy book to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Jupyter Book
        run: pip install "jupyter-book>=2,<3"
      # One build per language folder; add tc/ and sc/ here when they are published.
      - name: Build English edition
        working-directory: en
        env:
          BASE_URL: /${{ github.event.repository.name }}/en
        run: jupyter-book build --html
      - name: Assemble site
        run: |
          mkdir -p _site
          cp index.html _site/
          cp -r en/_build/html _site/en
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
